name: Build Threema iOS IPA
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout Threema
        uses: actions/checkout@v4
        with:
          repository: threema-ch/threema-ios
          ref: main
          fetch-depth: 1
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Install mise
        run: |
          brew install mise
      - name: Install project dependencies
        run: |
          mise install
          mise run dependencies
      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Threema.xcodeproj \
            -scheme Threema
      - name: Build Threema
        run: |
          xcodebuild archive \
            -project Threema.xcodeproj \
            -scheme Threema \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Threema.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R \
            build/Threema.xcarchive/Products/Applications/Threema.app \
            build/ipa/Payload/
          cd build/ipa
          zip -r -y ../../Threema-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Threema-unsigned-IPA
          path: Threema-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
